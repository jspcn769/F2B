    return `${pageHead('Cobertura i integritat','Base de dades','Visió del volum de dades incorporades, de les plantilles ja carregades i dels camps de conversió encara pendents.')}
      <div class="stats-grid">${stat(catalog().competitions.length,'Competicions catalogades')}${stat(DB.clubs.length,'Clubs')}${stat(DB.players.length,'Fitxes de jugador')}${stat(fixtures,'Enfrontaments')}</div>
      <div class="two-col"><section class="panel"><div class="panel-head"><div><h3>Dades incorporades</h3><p>Identitat i estructura per a la simulació.</p></div><span class="tag green">CARREGADES</span></div><div class="panel-body"><div class="kv"><span>Competició i temporada</span><b>1 / 1</b></div><div class="kv"><span>Identitats de club</span><b>20</b></div><div class="kv"><span>Participacions d'equip</span><b>20</b></div><div class="kv"><span>Jornades</span><b>${byRound}</b></div><div class="kv"><span>Enfrontaments</span><b>${fixtures}</b></div><div class="kv"><span>Fitxes de jugador</span><b>${DB.players.length}</b></div><div class="kv"><span>Participacions de jugador</span><b>${DB.playerSeasons.length}</b></div><div class="kv"><span>Clubs amb plantilla carregada</span><b>${coveredClubs}</b></div><div class="kv"><span>Elegibilitat sense incidències</span><b>${eligibleCount}</b></div><div class="kv"><span>Casos pendents de revisar</span><b>${eligibilityReview}</b></div></div></section>
      <section class="panel"><div class="panel-head"><div><h3>Dades que no s'han replicat</h3><p>Història original del futbol consultable en fonts externes.</p></div><span class="tag grey">EXCLOSES</span></div><div class="panel-body"><div class="kv"><span>Resultats del futbol</span><b>No</b></div><div class="kv"><span>Classificacions del futbol</span><b>No</b></div><div class="kv"><span>Estadístiques del futbol</span><b>No</b></div><div class="kv"><span>Dates, estadis i àrbitres</span><b>No</b></div></div></section></div>
      <div class="section-head"><div><h3>Estat de conversió F2B</h3><p>Les fitxes existeixen, però encara no s'ha convertit cap jugador.</p></div></div>
      <div class="grid cards-3"><div class="card"><h3>Mesures i perfil físic</h3><p>El Barça i el Madrid tenen el físic convertit amb font a la fitxa.</p></div><div class="card"><h3>Posicions i arquetips</h3><p>75 arquetips al catàleg i posicions revisades al Barça, Madrid i València.</p></div><div class="card"><h3>OVR, potencial i atributs</h3><p>28 conversions amb els 36 atributs F2B LAB. </p></div></div>
      <div class="section-head"><div><h3>Desament i còpies de seguretat</h3><p>Els canvis s'emmagatzemen al navegador actual.</p></div></div>
      <div class="note"><strong>Persistència local:</strong> l'edició directa desa automàticament les modificacions a l'emmagatzematge local del navegador. El botó JSON exporta una còpia que pots conservar o importar en un altre navegador. Els canvis no s'envien automàticament al repositori GitHub.</div>
      <div class="section-head"><div><h3>Fonts de plantilles</h3><p>Fonts de referència registrades per als sis clubs incorporats.</p></div></div>
      <div class="grid cards-3">${DB.sources.filter(x=>x.id.startsWith('SRC-BDFUTBOL-')&&x.id!=='SRC-BDFUTBOL-LALIGA-0809').map(x=>`<a class="card" href="${esc(x.url)}" target="_blank" rel="noopener"><h3>${esc(x.name)}</h3><p>${esc(x.scope||x.use||'Referència de plantilla')}</p><div class="meta">Obrir font ↗</div></a>`).join('')}</div>`;
  }


  const positionNames={BA:'Bases',ES:'Escoltes',AL:'Alers',AP:'Ales pivots',P:'Pivots'};
  const archetypePath=id=>'/archetypes/'+id;
  const archetypeEntry=id=>DB.archetypeCatalog.entries.find(item=>item.id===id);
  const archetypeProfile=id=>Object.hasOwn(DB.archetypeProfiles,id)?DB.archetypeProfiles[id]:undefined;
  const archetypeLink=(id,label,cls='archive-link')=>routeLink(archetypePath(id),esc(label),cls);

  function renderArchetypeIndex(){
    return pageHead('Catàleg F2B','Arquetips','75 fitxes detallades de bases, escoltes, alers, ales pivots i pivots.')+
      Object.entries(positionNames).map(([position,label])=>{
        const entries=DB.archetypeCatalog.entries.filter(entry=>entry.position===position);
        return `<section class="archive-section"><h2>${esc(label)}</h2><div class="archetype-grid">${entries.map(entry=>{
          const profile=archetypeProfile(entry.id);
          return `<a class="archetype-card" href="#${archetypePath(entry.id)}" data-route="${archetypePath(entry.id)}">
            <span class="archetype-code">${esc(entry.id)}</span><b>${esc(entry.name)}</b>
            ${profile?`<small>${esc(profile.identity)}</small>`:''}
          </a>`;
        }).join('')}</div></section>`;
      }).join('');
  }

  function renderArchetypeMatrix(id,profile){
    const catalog=DB.archetypeCatalog;
    const official=catalog.fit.rows[id];
    const groups=official??profile.proposal.groups;
    const dimensions=catalog.comparison.rows[id]??profile.proposal.dimensions;
    const names=new Map(DB.attributeDictionary);
    const stages=['Definitoris','De suport','Complementaris'];
    return `<section class="archetype-panel" id="archetype-matrix"><h2>Matriu i atributs</h2>
      <p class="archetype-caption">${official?'Fila registrada al catàleg F2B LAB.':'Proposta de calibratge. La fila original F2B LAB està pendent de recuperar.'}</p>
      <dl class="archetype-dimensions">${catalog.comparison.dimensions.map((label,i)=>`<div><dt>${esc(label)}</dt><dd>${esc(dimensions[i])}</dd></div>`).join('')}</dl>
      <p class="archetype-caption">● principal · ◐ secundària · ○ complementària · — no determinant</p>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Grup</th><th>Pes d’encaix</th><th>Atributs</th></tr></thead><tbody>${groups.map((codes,i)=>`
        <tr><td>${stages[i]}</td><td>${Math.round(Object.values(catalog.fit.weights)[i]*100)}%</td><td>${codes.map(code=>esc(code+' '+names.get(code))).join(' · ')}</td></tr>`).join('')}</tbody></table></div>
      <p class="archetype-caption">L’encaix combina les mitjanes dels tres grups. L’OVR continua sent la valoració del nivell del jugador a la seva posició.</p>
    </section>`;
  }

  function renderArchetypeDetail(id){
    const entry=archetypeEntry(id);
    if(!entry) return empty('◇','Arquetip desconegut','Consulta els arquetips registrats al catàleg.')+routeLink('/archetypes','Tornar al catàleg','btn');
    const profile=archetypeProfile(id);
    const trail=breadcrumbRow([{label:'Arquetips',path:'/archetypes'},{label:entry.name}]);
    const mast=pageHead(entry.id+' · '+(profile?.family??positionNames[entry.position]),entry.name,profile?.identity??'');
    if(!profile) return trail+mast+empty('◇','Fitxa detallada pendent','El codi i la denominació ja són al catàleg.');
    const refs=profile.references.map(ref=>{
      const p=player(ref.playerId);
      const m=playerSeason(ref.membershipId);
      const c=club(m.clubId);
      const role=ref.kind==='pilot'?'Assignació al pilot':'Cas de contrast';
      const position=[m.conversion.primaryPosition,m.conversion.secondaryPosition,m.conversion.tertiaryPosition].filter(Boolean).join(' / ');
      return `<li>${routeLink(playerPath(p.id),esc(p.fullName),'archive-link')} <small>${esc(c.name)} · 2008/09 · ${esc(role)} · ${esc(position)} · OVR ${esc(m.conversion.ovr)} / POT ${esc(m.conversion.potential)}</small></li>`;
    }).join('');
    const peers=DB.archetypeCatalog.entries.filter(item=>item.position===entry.position&&archetypeProfile(item.id));
    const i=peers.findIndex(item=>item.id===id);
    const adjacent=[peers[i-1],peers[i+1]].filter(Boolean);
    return `${trail}<article class="archetype-detail">${mast}
      <div class="archetype-grid detail-grid">
        <section class="archetype-panel"><h2>Com juga</h2><h3>Amb pilota</h3><p>${esc(profile.offense)}</p><h3>Sense pilota i en defensa</h3><p>${esc(profile.offBallDefense)}</p></section>
        <section class="archetype-panel"><h2>Encaix al quintet</h2><p>${esc(profile.fit)}</p><h3>Límits</h3><p>${esc(profile.limits)}</p><h3>Perfil físic</h3><p>${esc(profile.physical)}</p></section>
      </div>
      <section class="archetype-example"><h2>Una possessió característica</h2><p>${esc(profile.possession)}</p></section>
      ${renderArchetypeMatrix(id,profile)}
      <section class="archetype-panel"><h2>Com assignar-lo</h2><p>${esc(profile.assignment)}</p>
      <dl class="archetype-neighbors">${profile.near.map(peer=>`<div><dt>${archetypeLink(peer.id,peer.id+' · '+archetypeEntry(peer.id).name)}</dt><dd>${esc(peer.distinction)}</dd></div>`).join('')}</dl></section>
      <div class="archetype-grid detail-grid">
        <section class="archetype-panel"><h2>Referències F2B</h2><ul class="archetype-refs">${refs}</ul>${id==='BA-01'?'<p class="archetype-caption">Xavi · 185 cm / 75 kg F2B · encaix BA-01 de 94,4/99 amb els atributs del pilot.</p>':''}</section>
        <section class="archetype-panel"><h2>Proposta per al motor</h2><p>${esc(profile.engine)}</p><h3>Indicadors proposats</h3><ul>${profile.indicators.map(value=>`<li>${esc(value)}</li>`).join('')}</ul></section>
      </div>
      <nav class="archetype-pager" aria-label="Altres arquetips de la posició">${adjacent.map(item=>archetypeLink(item.id,item.id+' · '+item.name)).join('')}</nav>
    </article>`;
  }

  function renderArchetypes(){
    return route.archetypeId?renderArchetypeDetail(route.archetypeId):renderArchetypeIndex();
  }

  function render(){
    let html='';
    switch(route.page){
      case 'home': html=renderHome(); break;
      case 'competitions': html=renderCompetitions(); break;
      case 'competition': html=renderCompetition(); break;
      case 'season': html=renderSeason(); break;
      case 'clubs': html=renderClubs(); break;
      case 'club': html=renderClub(); break;
      case 'team': html=renderTeam(); break;
      case 'rounds': html=renderRounds(); break;
      case 'round': html=renderRound(); break;
      case 'fixture': html=renderFixture(); break;
      case 'seasons': html=renderSeasons(); break;
      case 'database': html=renderDatabase(); break;
      case 'archetypes': html=renderArchetypes(); break;
      case 'players': html=renderPlayers(); break;
      case 'player': html=renderPlayer(); break;
      default: html=empty('⌂','Pàgina no disponible','La ruta no existeix dins la versió actual de l’enciclopèdia.');
    }
    $('#content').innerHTML=html;
    setBreadcrumb(); setNav();
  }

  function searchIndex(q){
    const query=q.trim().toLocaleLowerCase('ca'); if(query.length<2)return [];
    const results=[];
    for(const c of DB.clubs){
      const hay=[c.name,c.shortName,c.city,...c.aliases].join(' ').toLocaleLowerCase('ca');
      if(hay.includes(query)) results.push({title:c.name,sub:`Club · ${c.city} · Temporada 2008/09`,icon:initials(c.shortName),path:clubPath(c.id)});
    }
    for(const entry of DB.archetypeCatalog.entries){
      if(filterText(entry.id+' '+entry.name).includes(filterText(query))) results.push({title:entry.name,sub:'Arquetip · '+entry.id,icon:entry.position,path:archetypePath(entry.id)});
    }
    for(const entry of catalog().competitions){
      const group=getGroup(entry.groupId);
      if(filterText([entry.name,group.name,...entry.aliases].join(' ')).includes(filterText(query))){
        results.push({title:entry.name,sub:'Competició · '+group.name,icon:group.id,path:competitionPath(entry.id)});
      }
    }
    if('2008/09 2008-09 temporada'.includes(query)) results.push({title:'Primera Divisió 2008/09',sub:'Temporada · 20 clubs · 38 jornades',icon:'08/09',path:pathSeason()});
    const roundMatch=query.match(/(?:jornada|j|round)\s*(\d{1,2})/i);
    if(roundMatch){const n=Number(roundMatch[1]);if(n>=1&&n<=38)results.push({title:`Jornada ${n}`,sub:'10 enfrontaments · 0 simulats',icon:String(n),path:roundPath(DB.rounds[n-1].id)});}
    const pair=DB.fixtures.find(f=>{
      const h=club(f.homeClubId),a=club(f.awayClubId); const name=`${h.name} ${a.name}`.toLocaleLowerCase('ca'); const short=`${h.shortName} ${a.shortName}`.toLocaleLowerCase('ca'); return name.includes(query)||short.includes(query);
    });
    if(pair){const h=club(pair.homeClubId),a=club(pair.awayClubId);results.push({title:`${h.name} — ${a.name}`,sub:`Jornada ${pair.roundNumber} · Enfrontament F2B pendent`,icon:'VS',path:fixturePath(pair.id)});}
    for(const p of DB.players){
      const ms=indexes.playerSeasonsByPlayer.get(p.id)||[];
      const hay=[p.fullName,p.displayName,...(p.aliases||[])].join(' ').toLocaleLowerCase('ca');
      if(hay.includes(query)){
        const m=ms[0], c=m?club(m.clubId):null;
        results.push({title:p.fullName,sub:`Jugador · ${c?.name||'F2B'} · Fitxa de conversió`,icon:initials(p.displayName||p.fullName),path:playerPath(p.id)});
      }
    }
    if('jugadors futbolistes fitxes plantilla'.includes(query)) results.push({title:'Directori de jugadors',sub:`${DB.players.length} fitxes · sis clubs`,icon:'PLY',path:'/players'});
    return results.slice(0,9);
  }
  function showSearch(q){
    const box=$('#searchResults'); const items=searchIndex(q);
    if(!items.length){box.hidden=true;box.innerHTML='';return;}
    box.innerHTML=items.map(x=>`<a class="search-item" href="#${esc(x.path)}" data-route="${esc(x.path)}"><span class="crest">${esc(x.icon)}</span><span><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span></a>`).join('');box.hidden=false;
  }
  $('#editToggle').addEventListener('click',()=>{
    editMode=!editMode; $('#editToggle').classList.toggle('active',editMode); $('#editToggle').textContent=editMode?'✓ Finalitzar edició':'✎ Editar dades';
    document.body.classList.toggle('edit-mode',editMode); render(); setSaveState(editMode?'Edició directa activada':'Mode de consulta','idle');
  });
  $('#exportData').addEventListener('click',exportLocalData);
  $('#importFile').addEventListener('change',async e=>{
    const file=e.target.files?.[0]; if(!file)return;
    try{await importLocalData(file);setSaveState('Còpia importada i desada localment','saved');}
    catch(error){setSaveState('Error important la còpia','error');alert(error.message||String(error));}
    e.target.value='';
  });
  function handleInlineEdit(e){
    const input=e.target.closest('[data-entity][data-id][data-field]'); if(!input||!editMode)return;
    const entity=input.dataset.entity, id=input.dataset.id, field=input.dataset.field;
    const obj=entity==='player'?player(id):playerSeason(id); if(!obj)return;
    let value=input.value;
    if(input.type==='number') value=value===''?null:Number(value);
    if(entity==='player' && ['identitySourceIds','aliases'].includes(field)) value=value.split(',').map(x=>x.trim()).filter(Boolean);
    setPath(obj,field,value);
    input.classList.add('edited');
    persistLocalEdits();
  }
  $('#content').addEventListener('input',handleInlineEdit);
  $('#content').addEventListener('change',handleInlineEdit);
  document.addEventListener('click',e=>{
    const link=e.target.closest('[data-route]');
    if(link){e.preventDefault();navigate(link.dataset.route);$('#searchResults').hidden=true;return;}
    if(!e.target.closest('.global-search')) $('#searchResults').hidden=true;
  });
  $('#globalSearch').addEventListener('input',e=>showSearch(e.target.value));
  $('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Escape')$('#searchResults').hidden=true;if(e.key==='Enter'){const first=$('.search-item');if(first)navigate(first.dataset.route);}});
  $('#mobileMenu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#mobileScrim').classList.add('open');});
  $('#mobileScrim').addEventListener('click',closeMobile);
  window.addEventListener('hashchange',()=>{parseRoute();render();});
  loadData().then(()=>{parseRoute();render();}).catch(err=>{$('#content').innerHTML=empty('!','Error carregant les dades',err.message);});
})();

  </script>
</body>
</html>
